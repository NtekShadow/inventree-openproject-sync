#This file is used to package the OpenProjectSync plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.1
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-openproject-sync"
description = "Sync InvenTree build and purchase orders with OpenProject work packages"
dynamic = ["version"]
authors = [
    { name = "Jan Malte Sörensen",email = "slenderplp@gmail.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin", "openproject"]
requires-python = ">=3.9"
dependencies = [
    # requests and Django REST framework are provided by InvenTree
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.entry-points."inventree_plugins"]
OpenProjectSync = "openproject_sync.core:OpenProjectSync"

[tool.setuptools.packages.find]
where = [""]
include = ["openproject_sync*"]

[tool.setuptools.dynamic]
version = {attr = "openproject_sync.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["openproject_sync"]

[tool.ruff.lint]

ignore = [
    "I001",
    "PIE790",
    "RUF012"
]
